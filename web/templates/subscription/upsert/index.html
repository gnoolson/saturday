<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="components/head"></th:block>
    <title th:text="#{subscription.upsert.title}"></title>
</head>

<body>
    <div class="app-layout">
        <th:block th:replace="components/sidebar"></th:block>
        <main class="content" id="app">

            <article>
                <div>
                    <span th:text="#{subscription.upsert.project}">Project: </span>
                    <a :href="'/project/' + client.projectId + '/edit'">{{projectName}}</a>
                </div>
                <div>
                    <span th:text="#{subscription.upsert.client}">Client: </span>
                    <a :href="'/client/' + client.id + '/edit'">{{client.name}}</a>
                </div>
                <div class="row pt-2">
                    <h3 class="title" th:text="#{subscription.upsert.title}">
                        Subscription
                    </h3>
                    <button @click="goToDeletePage()" th:text="#{subscription.upsert.button.delete_subscription}"
                        class="contrast" :disabled="deleteButtonDisabled">Delete Subscription</button>

                    <button th:text="#{subscription.upsert.button.save_subscription}" :disabled="saveButtonDisabled"
                        @click="saveSubscription()">Save Subscription</button>
                </div>
            </article>

            <article>
                <form>
                    <fieldset>

                        <s-service-error :errors="errors"></s-service-error>

                        <s-input :errors="errors" field="topicFilter" th:label="#{subscription.upsert.form.topic_filter}"
                            v-model:value="subscription.topicFilter" @changed="subscriptionChangedCallback()" info="subscription#topic_filter"></s-input>

                        <s-textarea :errors="errors" field="description"
                            th:label="#{subscription.upsert.form.description}" v-model:value="subscription.description"
                            @changed="subscriptionChangedCallback()" rows="4"  info="subscription#description"></s-textarea>

                        <s-select-script :errors="errors" field="scriptId"
                            th:label="#{subscription.upsert.form.script_name}" v-model:value="subscription.scriptId"
                            @changed="subscriptionChangedCallback()" :scripts="scripts" :empty-id="emptyId"
                            :selected-project="client.projectId"  info="subscription#script"></s-select-script>

                    </fieldset>
                </form>
            </article>

        </main>
    </div>
</body>

<script type="module" th:inline="javascript">

    import input from "/static/js/components/input.js"
    import textarea from "/static/js/components/textarea.js"
    import service_error from "/static/js/components/service-error.js"
    import select_script from "/static/js/components/select-script.js"


    const subscriptionId = [[${ subscriptionId }]];
    const clientId = [[${ clientId }]];
    const emptyId = [[${ emptyId }]];

    const app = {

        components: {
            "s-input": input,
            "s-textarea": textarea,
            "s-service-error": service_error,
            "s-select-script": select_script,
        },

        mounted() {
            this.loadSubscription();
            this.loadScripts();
            this.loadClient();
            this.loadProjects();
            this.addExitEventListener();
        },

        data() {
            return {
                client: {
                    id: clientId,
                },
                subscription: {
                    id: subscriptionId
                },
                errors: [],
                scripts: [],
                projects: [],

                clientLoaded: false,
                projectsLoaded: false,
                scriptsLoaded: false,
                subscriptionLoaded: false,

                subscriptionChanged: false,
                saveInAction: false,
                emptyId: emptyId
            }
        },

        methods: {

            saveSubscription() {
                this.saveInAction = true;
                axios.post("/api/client/" + clientId + "/subscription/upsert", this.subscription).then((response) => {
                    this.subscriptionChanged = false;
                    this.saveInAction = true;
                    window.location.href = "/client/" + clientId + "/subscription/all";
                }, (error) => {
                    this.errors = error.response.data;
                    this.saveInAction = false;
                });
            },

            subscriptionChangedCallback() {
                if (this.dataLoaded) {
                    this.subscriptionChanged = true;
                }
            },

            addExitEventListener() {
                window.addEventListener('beforeunload', (e) => {
                    if (this.subscriptionChanged) {
                        e.preventDefault();
                        e.returnValue = '';
                    }
                });
            },

            loadProjects() {
                axios.get("/api/project/all").then((response) => {
                    this.projects = response.data;
                    this.projectsLoaded = true;
                }, (error) => {
                    console.error(error);
                });
            },

            loadSubscription() {
                const url = "/api/client/" + this.client.id + "/subscription/" + subscriptionId;
                axios.get(url).then((response) => {
                    this.subscription = response.data;
                    this.subscriptionLoaded = true;
                }, (error) => {
                    console.error(error);
                });
            },

            loadClient() {
                axios.get("/api/client/" + this.client.id
                ).then((response) => {
                    this.client = response.data;
                    this.clientLoaded = true;
                }, (error) => {
                    console.error(error);
                });
            },

            loadScripts() {
                axios.get("/api/script/all").then((response) => {
                    this.scripts = response.data;
                    this.scriptsLoaded = true;
                }, (error) => {
                    console.error(error);
                });
            },

            goToDeletePage(){
                window.location.href = "/client/" + this.client.id + "/subscription/" + this.subscription.id + "/delete";
            }

        },

        computed: {

            projectName() {
                let result = "";
                this.projects.forEach(project => {
                    if (project.id === this.client.projectId)
                        result = project.name;
                });
                return result;
            },

            dataLoaded() {
                return this.clientLoaded && this.projectsLoaded && this.scriptsLoaded && this.subscriptionLoaded;
            },

            saveButtonDisabled() {
                return !this.subscriptionChanged || this.saveInAction;
            },

            deleteButtonDisabled() {
                return this.subscription.id === this.emptyId;
            }

        }

    };

    Vue.createApp(app).mount('#app');

</script>

</html>
