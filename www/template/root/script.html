<script type="module" th:inline="javascript">
    import projectRepository from /*[[ '/static/js/repository/project-repository.js?v=' + ${version} ]]*/ "/static/js/repository/project-repository.js"
    import dashboardRepository from /*[[ '/static/js/repository/dashboard-repository.js?v=' + ${version} ]]*/ "/static/js/repository/dashboard-repository.js"

    const app = {
        data() {
            return {
                dashboards: [],
                projects: []
            }
        },
        mounted() {
            this.loadDashboards();
            this.loadProjects();
        },
        methods: {
            loadDashboards() {
                dashboardRepository.getAvailable((data) => {
                    this.dashboards = data;
                });
            },
            loadProjects() {
                projectRepository.getAvailable((data) => {
                    this.projects = data;
                });
            },
            getProjectNameById(id) {
                let result = "";
                this.projects.forEach(project => {
                    if (project.id === id)
                        result = project.name;
                });
                return result;
            },
            openDashbaord(dashbaord) {
                window.location.href = "/dashboard/open/" + dashbaord.id;
            }
        }
    };

    Vue.createApp(app).mount("#root_page");
</script>
