<hr class="s-hl">

<div class="pure-g" id="panels-grid">

    <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3" v-for="dashboard in dashboards">
        <div class="panel-card">
            <span class="badge">{{getProjectNameById(dashboard.projectId)}}</span>
            <h3 class="panel-name">{{dashboard.name}}</h3>
            <div class="panel-actions">
                <button @click="openDashbaord(dashboard)" class="pure-button" th:text="#{root.panel.button.1}"></button>
            </div>
        </div>
    </div>

    <h3 v-if="!dashboards.length" th:text="#{root.panel.message.1}"></h3>

</div>
