<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="_component/head"></th:block>
    <title th:text="#{project.delete.title}"></title>
</head>

<body>
    <main id="delete_project">
        <th:block th:replace="_component/menu"></th:block>
        <div class="s-main-container">

            <div class="pure-g">
                <div class="pure-u-1">
                    <h2><span th:text="#{project.delete.message.1}" class="pr-2"></span>"{{project.name}}"</h2>
                    <p th:text="#{project.delete.message.2}">
                    </p>
                </div>
            </div>

            <div class="pure-g pt-4">
                <div class="pure-u-1" style="text-align: center;">
                    <button @click="goToAllProjectsPage()" th:text="#{project.delete.button.2}"
                        class="pure-button pure-button-primary mr-1">No</button>
                    <button @click="deleteProject()" th:text="#{project.delete.button.1}" class="pure-button"
                        :disabled="deleteButtonDisabled">Yes</button>
                </div>
            </div>

            <div style="text-align: center; height: 14px;">
                <span v-if="isWaiting">
                    waiting ...
                </span>
            </div>

            <th:block th:replace="_component/footer"></th:block>

        </div>
    </main>
    <th:block th:replace="project/delete/script"></th:block>
</body>

</html>
