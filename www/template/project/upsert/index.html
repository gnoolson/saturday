<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="_component/head"></th:block>
    <title th:text="#{project.upsert.title}"></title>
</head>

<body>
    <main id="upsert_project">
        <th:block th:replace="_component/menu"></th:block>
        <div class="s-main-container">

            <div class="pure-g">
                <div class="pure-u-1">
                    <h2 th:text="#{project.upsert.message.1}"></h2>
                    <p th:text="#{project.upsert.message.2}">
                    </p>
                </div>
            </div>

            <div class="pure-g">
                <div class="pure-u-1">
                    <div style="text-align: right;">
                        <button type="button" class="pure-button mr-1" th:text="#{project.upsert.button.2}"
                            @click="goToDeletePage()" :disabled="deleteButtonDisabled">Delete</button>
                        <button type="button" class="pure-button pure-button-primary"
                            th:text="#{project.upsert.button.1}" :disabled="saveButtonDisabled"
                            @click="saveProject()">Save</button>
                    </div>
                </div>
            </div>

            <s-error-message :errors="errors" field="service" :box="true"></s-error-message>

            <th:block th:replace="project/upsert/form"></th:block>
            <th:block th:replace="_component/footer"></th:block>

        </div>
    </main>
    <th:block th:replace="project/upsert/script"></th:block>
</body>

</html>
