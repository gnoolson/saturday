<script type="module" th:inline="javascript">
	import id from /*[[ '/static/js/component/id.js?v=' + ${version} ]]*/ "/static/js/component/id.js"
	import input from /*[[ '/static/js/component/input.js?v=' + ${version} ]]*/ "/static/js/component/input.js"
	import textarea from /*[[ '/static/js/component/textarea.js?v=' + ${version} ]]*/ "/static/js/component/textarea.js"
	import errorMessage from /*[[ '/static/js/component/error-message.js?v=' + ${version} ]]*/ "/static/js/component/error-message.js"
	import projectRepository from /*[[ '/static/js/repository/project-repository.js?v=' + ${version} ]]*/  "/static/js/repository/project-repository.js"

	const projectId = [[${ id }]];
	const emptyId = [[${ emptyId }]];

	const app = {
		components: {
			"s-input": input,
			"s-textarea": textarea,
			"s-error-message": errorMessage,
			"s-id": id
		},
		mounted() {
			this.loadProject();
			this.addExitEventListener();
		},
		data() {
			return {
				project: {
					id: projectId
				},
				errors: [],
				projectChanged: false,
				saveInAction: false,
				emptyId: emptyId
			}
		},
		methods: {
			loadProject() {
				projectRepository.get(this.project.id, (data) => {
					this.project = data;
				});
			},
			saveProject() {
				this.saveInAction = true;
				projectRepository.save(this.project, (data) => {
					this.projectChanged = false;
					this.saveInAction = false;
					window.location.href = "/project/all";
				}, (error) => {
					this.errors = error.response.data;
					this.saveInAction = false;
				});
			},
			projectChangedCallback() {
				this.projectChanged = true;
			},
			goToDeletePage() {
				window.location.href = "/project/" + this.project.id + "/delete";
			},
			addExitEventListener() {
				window.addEventListener('beforeunload', (e) => {
					if (this.projectChanged) {
						e.preventDefault();
						e.returnValue = '';
					}
				});
			}
		},
		computed: {
			deleteButtonDisabled() {
				return this.project.id === emptyId;
			},
			saveButtonDisabled() {
				return !this.projectChanged || this.saveInAction;
			},
			copyIdAvailable() {
				return this.project.id !== emptyId;
			}
		}
	};

	Vue.createApp(app).mount("#upsert_project");
</script>
