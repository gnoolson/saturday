<script type="module" th:inline="javascript">
    import name_filter from /*[[ '/static/js/component/name-filter.js?v=' + ${version} ]]*/  "/static/js/component/name-filter.js"
    import projectRepository from /*[[ '/static/js/repository/project-repository.js?v=' + ${version} ]]*/  "/static/js/repository/project-repository.js"

    const SUPER_ACCESS = [[${ superAccess }]];

    const app = {
        components: {
            "s-name-filter": name_filter
        },
        mounted() {
            this.loadProjects();
        },
        data() {
            return {
                projects: [],
                resultAfterNameFilter: [],
                superAccess: SUPER_ACCESS,
                projectsLoaded: false
            }
        },
        methods: {
            loadProjects() {
                projectRepository.getAll((data) => {
                    this.projects = data;
                    this.projectsLoaded = true;
                });
            },
            goToCreateNewProjectPage() {
                window.location.href = "/project/create";
            },
            goToEditProjectPage(project) {
                window.location.href = "/project/" + project.id + "/edit";
            },
            getProjectDescription(project) {
                if (!project.description.length) {
                    return "no description";
                }

                if (project.isExpanded) {
                    return project.description;
                } else {
                    let maxLength = 100;
                    let description = project.description.slice(0, maxLength);
                    if (project.description.length > maxLength) {
                        description += " ...";
                    }
                    return description;
                }
            },
            setResultAfterNameFilter(entities) {
                this.resultAfterNameFilter = entities;
            }
        },
        computed: {
            filteredProjects() {
                return this.resultAfterNameFilter;
            },
        }
    };

    Vue.createApp(app).mount('#all_projects');
</script>
