<hr class="s-hl" />

<form class="pure-form">
    <fieldset>
        <div class="pure-control-group">
            <s-id :id="script.id" :empty-id="emptyId"></s-id>
        </div>

        <div class="pure-control-group">
            <s-select-project :errors="errors" field="projectId" th:label="#{script.upsert.form.label.1}"
                v-model:value="script.projectId" @changed="scriptChangedCallback()" :projects="projects"
                :empty-id="emptyId" :entity-id="script.id" info="script#project" :size="1"></s-select-project>
        </div>

        <div class="pure-control-group">
            <s-input :errors="errors" field="name" th:label="#{script.upsert.form.label.2}" v-model:value="script.name"
                @changed="scriptChangedCallback()" info="script#name" :size="1"></s-input>
        </div>

        <div class="pure-control-group">
            <s-textarea :errors="errors" field="description" th:label="#{script.upsert.form.label.3}"
                v-model:value="script.description" @changed="scriptChangedCallback()" rows="4" info="script#description"
                :size="1"></s-textarea>
        </div>

        <div class="pure-control-group">
            <s-select-event-handler :errors="errors" field="errorEventHandler" th:label="#{script.upsert.form.label.4}"
                th:error-message="#{select_event_handler.message.0}" v-model:value="script.errorEventHandler"
                @changed="scriptChangedCallback()" :scripts="filteredScripts" :empty-id="emptyId" :ready="dataLoaded"
                :selected-project="script.projectId" info="script#error-handler" :size="1"></s-select-event-handler>
        </div>

        <div class="pure-control-group">
            <div class="pure-g">
                <div class="pure-u-1-2">
                    <label>
                        <span th:text="#{script.upsert.form.label.5}" class="mr-1">Caching Time</span>
                        <a href="/docs/script#cache" target="_blank"><img src="/static/img/info-circle-svgrepo-com.svg"
                                class="s-svg-icon" /></a>
                    </label>
                </div>
                <div class="pure-u-1-2" style="text-align: right;">
                    {{minutesToString(script.cachingTime)}}
                </div>
            </div>
            <input type="range" v-model="script.cachingTime" min="0" max="10800" step="60" class="pure-input-1"
                @change="scriptChangedCallback()" />
        </div>

        <s-cb th:label="#{script.upsert.form.label.7}" v-model:value="script.autostart" info="script#autostart"
            @changed="scriptChangedCallback()"></s-cb>

    </fieldset>
</form>
