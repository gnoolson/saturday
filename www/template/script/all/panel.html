<hr class="s-hl">

<div class="pure-g">
    <div class="pure-u-1-2">

        <s-project-filter :projects="projects" :entities="scripts" :page="scripts" :ready="projectsAndScriptsLoaded"
            th:default-value-label="#{project_filter.placeholder}"
            @result="setResultAfterProjectFilter"></s-project-filter>

        <s-name-filter :entities="resultAfterProjectFilter" :page="scripts" :ready="projectsAndScriptsLoaded"
            th:placeholder="#{name_filter.placeholder}" @result="setResultAfterNameFilter"></s-name-filter>

    </div>
    <div class="pure-u-1-2" style="text-align: right;" v-if="superAccess">
        <button type="button" class="pure-button pure-button-primary pt-2" @click="goToCreateNewScriptPage"
            v-if="superAccess" th:text="#{script.all.button.7}">Create</button>
    </div>
</div>

<div v-for="script in scriptsWithErrors" class="error-message-box">
    <a :href="'#script_' + script.id">The {{getProjectNameById(script.projectId)}}:{{script.name}} script contains
        errors</a>
</div>

<div class="pure-g pt-2" id="panels-grid">
    <div class="pure-u-1" v-for="script in filteredScripts">
        <div class="panel-card" :id="'script_' + script.id">
            <span class="badge">{{getProjectNameById(script.projectId)}}</span>

            <div class="pure-g">
                <div class="pure-u-1 pure-u-sm-1-2">
                    <h3 class="panel-name">{{script.name}}</h3>
                </div>
                <div class="pure-u-1 pure-u-sm-1-2 s-align-right">
                    <span v-if="script.autostart" class="badge badge-blue"
                        th:title="#{script.all.message.4}">autostart</span>

                    <span class="badge badge-green" v-if="script.enabled" th:text="#{script.all.message.3}">
                        status: enabled
                    </span>

                    <span class="badge badge-red" v-if="!script.enabled">
                        <span th:text="#{script.all.message.2}">status: disabled</span>
                        <span class="" th:text="#{script.all.message.1}" v-if="script.blocked">and blocked</span>
                    </span>
                </div>
            </div>

            <div>
                <pre>{{getScriptDescription(script)}}</pre>
                <div v-if="script.description.length > 100">
                    <button type="button" class="panel-desc-button" @click="script.isExpanded = true"
                        th:text="#{script.all.button.1}" v-if="!script.isExpanded">
                    </button>
                    <button type="button" class="panel-desc-button" @click="script.isExpanded = false"
                        th:text="#{script.all.button.2}" v-if="script.isExpanded">
                    </button>
                </div>
            </div>
            <div class="panel-actions">

                <div class="pure-g">
                    <div class="pure-u-1-4" style="text-align: left;">
                        <button th:text="#{script.all.button.1}" :disabled="isEnableButtonDisabled(script)"
                            class="pure-button ml-1 mt-1" v-if="isEnableButtonAvailable(script)"
                            @click="control(script, true)">
                            Enable
                        </button>

                        <button th:text="#{script.all.button.2}" :disabled="isDisableButtonDisabled(script)"
                            class="pure-button ml-1 mt-1" v-if="isDisableButtonAvailable(script)"
                            @click="control(script, false)">
                            Disable
                        </button>
                    </div>
                    <div class="pure-u-3-4">
                        <button th:text="#{script.all.button.4}" @click="goToErrorsPage(script)"
                            :disabled="!hasErrors(script)" class="pure-button mt-1 s-button-error">
                            Errors
                        </button>

                        <button th:text="#{script.all.button.3}" @click="goToLogPage(script)"
                            class="pure-button ml-1 mt-1">
                            Log
                        </button>

                        <button @click="goToDevPage(script)" class="pure-button ml-1 mt-1" type="button"
                            v-if="superAccess" th:text="#{script.all.button.6}">Dev</button>

                        <button @click="goToEditScriptPage(script)" class="pure-button ml-1 mt-1" type="button"
                            v-if="superAccess" th:text="#{script.all.button.5}">Edit</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<h3 th:text="#{script.all.message.6}" style="text-align: center;" v-if="!filteredScripts.length">Nothing to display</h3>
