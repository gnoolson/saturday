<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="_component/head"></th:block>
    <title th:text="#{script.dev.title}"></title>

    <script th:src="@{/static/codemirror/lib/codemirror.js(v=${version})}"></script>
    <script th:src="@{/static/codemirror/lib/autorefresh.js(v=${version})}"></script>
    <script th:src="@{/static/codemirror/mode/lua/lua.js(v=${version})}"></script>
    <script th:src="@{/static/codemirror/mode/javascript/javascript.js(v=${version})}"></script>
    <link rel="stylesheet" th:href="@{/static/codemirror/lib/codemirror.css(v=${version})}">
    <link rel="stylesheet" th:href="@{/static/css/codemirror.css(v=${version})}" />
    <link rel="stylesheet" th:href="@{/static/css/dev.css(v=${version})}" />
</head>

<body>
    <main id="dev_script">
        <div class="container" id="main-container">
            <div class="panel top-panel" id="topPanel">
                <th:block th:replace="script/dev/menu"></th:block>
                <th:block th:replace="script/dev/top-panel"></th:block>
            </div>
            <div class="resizer" id="dragMe"></div>
            <div class="panel bottom-panel" id="bottomPanel">
                <th:block th:replace="script/dev/bottom-panel"></th:block>
            </div>
        </div>
    </main>
    <th:block th:replace="script/dev/vanilla-script"></th:block>
    <th:block th:replace="script/dev/vuejs-script"></th:block>
</body>

</html>
