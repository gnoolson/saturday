<script type="module" th:inline="javascript">
    import codeMirror from /*[[ '/static/js/component/code-mirror.js?v=' + ${version} ]]*/ "/static/js/component/code-mirror.js"
    import includedScripts from  /*[[ '/static/js/component/included-scripts.js?v=' + ${version} ]]*/ "/static/js/component/included-scripts.js"
    import executeScript from /*[[ '/static/js/component/execute-script.js?v=' + ${version} ]]*/  "/static/js/component/execute-script.js"
    import timeout from /*[[ '/static/js/timeout.js?v=' + ${version} ]]*/  "/static/js/timeout.js"
    import scriptRepository from /*[[ '/static/js/repository/script-repository.js?v=' + ${version} ]]*/  "/static/js/repository/script-repository.js"

    const messagesForExecute = {
        message_4: [[#{ execute_script.message.4}]],
        message_1: [[#{ execute_script.message.1 }]],
        message_2: [[#{ execute_script.message.2 }]],
        button_1: [[#{ execute_script.button.1 }]],
        button_2: [[#{ execute_script.button.2 }]],
        button_3: [[#{ execute_script.button.3 }]],
        button_4: [[#{ execute_script.button.4 }]],
        message_3: [[#{ execute_script.message.3 }]]
    };

    const messagesForIncludedScripts = {
        message_1: [[#{ included_scripts.message.1 }]],
        message_2: [[#{ included_scripts.message.2 }]],
        message_3: [[#{ included_scripts.message.3 }]],
        message_4: [[#{ included_scripts.message.4 }]]
    };

    const scriptId = [[${ id }]];

    const app = {
        components: {
            "s-code-mirror": codeMirror,
            "s-included-scripts": includedScripts,
            "s-execute-script": executeScript
        },
        mounted() {
            this.loadScript();
            this.addExitEventListener();
            this.getNumberOfErrors();
            this.isScriptEnabled();
            initDragMe(() => {
                this.output.show = false;
            }, () => {
                this.output.show = true;
            });
        },
        data() {
            return {
                script: {
                    id: scriptId,
                    code: "",
                    includedScripts: []
                },
                output: {
                    message: "",
                    show: false
                },
                luaChanged: false,
                scriptChanged: false,
                scriptLoaded: false,
                messagesForExecute,
                messagesForIncludedScripts,
                beautifyButtonDisabled: false,
                saveInAction: false,
                numberOfErrors: 0,
                enabled: false
            }
        },
        methods: {
            control(flag) {
                timeout.cancel("script_state");
                scriptRepository.enable(this.script.id, flag, (data) => {
                    this.isScriptEnabled();
                    this.errors = [];
                }, (error) => {
                    this.errors = error.response.data;
                    this.isScriptEnabled();
                });
            },
            isScriptEnabled() {
                scriptRepository.isEnabled(this.script.id, (data) => {
                    this.enabled = data;
                    timeout.exec("script_state", this.isScriptEnabled, 2000);
                }, (error) => {
                    console.error(error);
                    timeout.exec("script_state", this.isScriptEnabled, 5000);
                });
            },
            getNumberOfErrors() {
                scriptRepository.getNumberOfErrors(this.script.id, (data) => {
                    this.numberOfErrors = data;
                    timeout.exec("get_number_of_errors", this.getNumberOfErrors, 2000);
                }, (error) => {
                    console.error(error);
                    timeout.exec("get_number_of_errors", this.getNumberOfErrors, 5000);
                });
            },
            goToErrorPage() {
                window.open("/script/" + this.script.id + "/errors", "_blank");
            },
            goToLogPage() {
                window.open("/script/" + this.script.id + "/log", "_blank");
            },
            goToDocsPage() {
                window.open("/docs/", "_blank");
            },
            setTitle() {
                document.title = "Dev: " + this.script.name;
            },
            hideOutputMessage() {
                this.output.show = false;
                minimizeBottomPanel();
            },
            showOutputMessage() {
                this.output.show = true;
                restoreBottomPanel();
            },
            toggleOutputMessage() {
                if (this.output.show)
                    this.hideOutputMessage();
                else
                    this.showOutputMessage();
            },
            saveScript() {
                this.saveInAction = true;

                let dto = {
                    id: this.script.id,
                    code: this.script.code,
                    includedScripts: this.script.includedScripts
                };

                scriptRepository.updateCode(dto, (data) => {
                    this.scriptChanged = false;
                    this.luaChanged = false;
                    timeout.exec("save", () => {
                        this.saveInAction = false;
                    }, 1000);

                    this.output.message = "-- " + getFormatedTime(new Date()) + " saved";
                    this.showOutputMessage();
                }, (error) => {
                    this.output.message = "-- " + getFormatedTime(new Date()) + " error\n\r" + errorMessage(error.response.data);
                    this.showOutputMessage();
                    timeout.exec("save", () => {
                        this.saveInAction = false;
                    }, 1000);
                });
            },
            beautifyLua() {
                this.beautifyButtonDisabled = true;

                timeout.exec("beautify", () => {
                    this.beautifyButtonDisabled = false;
                }, 1000);

                axios.post("/api/script/beautify", this.script.code, { headers: { 'Content-Type': 'text/plain' } }).then((response) => {
                    this.luaChangedCallback(response.data);
                    this.output.message = "-- " + getFormatedTime(new Date()) + " formated";
                    this.showOutputMessage();
                }, (error) => {
                    this.output.message = "-- " + getFormatedTime(new Date()) + " error\n\r" + error.response.data[0].message;
                    this.showOutputMessage();
                });
            },
            luaChangedCallback(code) {
                if (this.script.code === code)
                    return;

                this.script.code = code;
                this.luaChanged = true;
            },
            loadScript() {
                scriptRepository.get(scriptId, (data) => {
                    this.script = data;
                    this.setTitle();
                    this.scriptLoaded = true;
                });
            },
            addExitEventListener() {
                window.addEventListener('beforeunload', (e) => {
                    if (this.scriptChanged || this.luaChanged) {
                        e.preventDefault();
                        e.returnValue = '';
                    }
                });
            },
            includedScriptsChangedCallback(value) {
                this.script.includedScripts = value;
                this.scriptChanged = true;
            },
            setExecutionResult(message) {
                this.showOutputMessage();
                this.output.message = message;
            }
        },
        computed: {
            saveButtonDisabled() {
                return !this.luaChanged && !this.scriptChanged || this.saveInAction;
            }
        }
    };

    function getFormatedTime(date) {
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const seconds = String(date.getSeconds()).padStart(2, '0');
        const ms = String(date.getMilliseconds()).padStart(3, '0');
        return hours + ":" + minutes + ":" + seconds + ":" + ms;
    }

    function errorMessage(errors) {
        let result = "";
        for (let i = 0; i < errors.length; i++) {
            const error = errors[i];
            result += error.message;

            if (i < errors.length - 1)
                result += "; ";
        }
        return result;
    }

    Vue.createApp(app).mount("#dev_script");
</script>
