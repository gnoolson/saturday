<script type="module" th:inline="javascript">
    import input from /*[[ '/static/js/component/input.js?v=' + ${version} ]]*/ "/static/js/component/input.js";
    import errorMessage from /*[[ '/static/js/component/error-message.js?v=' + ${version} ]]*/ "/static/js/component/error-message.js"

    const app = {
        components: {
            "s-error-message": errorMessage,
            "s-input": input
        },
        data() {
            return {
                loginForm: {
                    username: "",
                    password: ""
                },
                errors: [],
                loginButtonDisabled: false
            }
        },
        mounted() {
            const form = document.getElementById("login-form");

            form.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    this.loginAction();
                }
            });
        },
        methods: {
            closeDialog() {
                this.$refs.dialog.close();
            },
            showDialog() {
                this.$refs.dialog.showModal();
            },
            loginAction() {
                this.loginButtonDisabled = true;
                this.errors = []

                auth(this.loginForm, () => {
                    window.location.href = "/";
                }, (error) => {
                    this.errors = error.response.data;
                    this.loginButtonDisabled = false;
                })
            }
        }
    };


    function auth(requestBody, successCallback, errorCallback) {
        axios.post("/api/login", requestBody).then((response) => {
            successCallback();
        }, (error) => {
            errorCallback(error);
        });
    }

    Vue.createApp(app).mount("#login_page");
</script>
