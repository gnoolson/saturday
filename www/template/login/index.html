<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="_component/head"></th:block>
    <title th:text="#{login.title}"></title>
</head>

<body>
    <main id="login_page">

        <th:block th:replace="_component/menu"></th:block>

        <div class="s-main-container">
            <div class="pure-g">
                <div class="pure-u-1">

                    <h2 th:text="#{login.message.2}">Authorization Required</h2>
                    <p th:text="#{login.message.1}">Please enter your username and password.</p>

                    <th:block th:replace="login/login_form"></th:block>
                    <th:block th:replace="login/footer"></th:block>

                </div>
            </div>
        </div>

        <th:block th:replace="login/forgot_password_dialog"></th:block>

    </main>
    <th:block th:replace="login/script"></th:block>
</body>
</html>
