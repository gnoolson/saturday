<!DOCTYPE html>
<html lang="uk" xmlns:th="http://thymeleaf.org">

<head>
    <load src="../../_components/head/common.html" />
    <title th:text="#{subscription.all.message.1}"></title>

    <link rel="stylesheet" href="./style.scss">
    <script th:inline="javascript">
        const clientId = /*[[${ clientId }]]*/ "";
    </script>
</head>

<body>
    <main>
        <load src="../../_components/top.html" />
        <div class="s-main-container" id="app">

            <div class="pure-g">
                <div class="pure-u-1">
                    <h2 th:text="#{subscription.all.message.2}"></h2>
                    <h3 th:text="#{subscription.all.message.5}"></h3>
                    <h3 th:text="#{subscription.all.message.3}"></h3>
                    <p th:text="#{subscription.all.message.4}"></p>
                </div>
            </div>

            <hr class="s-hl">

            <div class="pure-g">
                <div class="pure-u-1 s-align-right" v-if="superAccess">
                    <button type="button" class="pure-button pure-button-primary pt-2" @click="goToCreateNewPage()" th:text="#{subscription.all.message.7}">Create</button>
                </div>
            </div>

            <div class="pure-g pt-2">
                <div class="pure-u-1" v-for="subscription in subscriptions">
                    <div class="s-panel-card">
                        <div>
                            <span th:text="#{subscription.all.message.10}" class="pr-1"></span>
                            <span class="s-code">{{subscription.topicFilter}}</span>
                        </div>
                        <div>
                            QoS: <span class="s-code">{{subscription.qos}}</span>
                        </div>
                        <div>
                            <pre>{{getDescription(subscription)}}</pre>
                            <div v-if="subscription.description.length > 100">
                                <button type="button" class="s-panel-desc-button" @click="expandDescription(subscription.id)" th:text="#{subscription.all.message.11}" v-if="!isDescriptionExpanded(subscription.id)">
                                </button>
                                <button type="button" class="s-panel-desc-button" @click="collapseDescription(subscription.id)" th:text="#{subscription.all.message.12}" v-if="isDescriptionExpanded(subscription.id)">
                                </button>
                            </div>
                        </div>
                        <div class="s-panel-actions">
                            <button @click="goToEditPage(subscription)" class="pure-button ml-1 mt-1" type="button" th:text="#{subscription.all.message.9}" v-if="superAccess">Edit</button>
                        </div>
                    </div>
                </div>
            </div>

            <h3 th:text="#{subscription.all.message.8}" class="s-align-center" v-if="!subscriptions.length">Nothing to display</h3>

            <s-footer></s-footer>
        </div>
        <script type="module" src="./main.js"></script>
    </main>
</body>

</html>
