<form class="pure-form">
    <fieldset>
        <div class="pure-control-group">
            <s-id :id="dashboard.id" :empty-id="emptyId"></s-id>
        </div>

        <div class="pure-control-group">
            <s-select-project :errors="errors" field="projectId" th:label="#{dashboard.upsert.message.6}" v-model:value="dashboard.projectId" @changed="dashboardChangedCallback()" :projects="projects" :empty-id="emptyId" :entity-id="dashboard.id" info="dashboard#project"
                :classes="['pure-u-1']"></s-select-project>
        </div>

        <div class="pure-control-group">
            <s-input :errors="errors" field="name" th:label="#{dashboard.upsert.message.7}" v-model:value="dashboard.name" @changed="dashboardChangedCallback()" info="dashboard#name" :classes="['pure-u-1']"></s-input>
        </div>

        <div class="pure-control-group">
            <s-textarea :errors="errors" field="description" th:label="#{dashboard.upsert.message.8}" v-model:value="dashboard.description" @changed="dashboardChangedCallback()" rows="4" info="dashboard#description" :classes="['pure-u-1']"></s-textarea>
        </div>

        <div class="pure-control-group">
            <s-select-script :errors="errors" field="scriptId" th:label="#{dashboard.upsert.message.9}" v-model:value="dashboard.scriptId" @changed="dashboardChangedCallback()" :scripts="scripts" :empty-id="emptyId" :selected-project="dashboard.projectId" info="dashboard#script-handler"
                :classes="['pure-u-1']"></s-select-script>
        </div>

        <div class="pure-control-group">
            <label>
                <span>
                    <span th:text="#{dashboard.upsert.message.10}" class="pr-1">
                        Access
                    </span>
                    <a href="/doc/dashboard#access" target="_blank"><img src="/public/img/info-circle-svgrepo-com.svg" class="s-svg-icon" /></a>
                </span>
            </label>
            <select v-model="dashboard.access" @change="dashboardChangedCallback()" class="pure-input-1">
                <option :value="'SUPER'" th:text="#{dashboard.upsert.message.11}">SUPER</option>
                <option :value="'VIEWER'" th:text="#{dashboard.upsert.message.12}">VIEWER</option>
                <option :value="'ANONYMOUS'" th:text="#{dashboard.upsert.message.13}">ANONYMOUS</option>
            </select>
        </div>

    </fieldset>
</form>
