<!DOCTYPE html>
<html lang="uk" xmlns:th="http://thymeleaf.org">

<head>
    <load src="../../_components/head/common.html" />
    <title th:text="#{dashboard.all.message.1}"></title>

    <link rel="stylesheet" href="./style.scss">
</head>

<body>
    <main>
        <load src="../../_components/top.html" />
        <div class="s-main-container" id="app">

            <div class="pure-g">
                <div class="pure-u-1">
                    <h2 th:text="#{dashboard.all.message.2}"></h2>
                    <p th:text="#{dashboard.all.message.3}">
                    </p>
                </div>
            </div>

            <hr class="s-hl">

            <div class="pure-g">
                <div class="pure-u-1-2">
                    <s-project-filter :projects="projects" :entities="dashboards" page="dashboards" :ready="projectsAndDashboardsLoaded" th:default-value-label="#{project_filter.message.0}" @result="setResultAfterProjectFilter"></s-project-filter>
                    <s-name-filter :entities="resultAfterProjectFilter" page="dashboards" :ready="projectsAndDashboardsLoaded" th:placeholder="#{name_filter.message.0}" @result="setResultAfterNameFilter"></s-name-filter>
                </div>
                <div class="pure-u-1-2 s-align-right" v-if="superAccess">
                    <button type="button" class="pure-button pure-button-primary pt-2" @click="goToCreateNewPage" th:text="#{dashboard.all.message.4}">Create</button>
                </div>
            </div>

            <div class="pure-g pt-2">
                <div class="pure-u-1" v-for="dashboard in filteredDashboards">
                    <div class="s-panel-card">
                        <span class="s-badge">{{getProjectNameById(dashboard.projectId)}}</span>

                        <div class="pure-g">
                            <div class="pure-u-1 pure-u-sm-1-2">
                                <h3 class="s-panel-name">{{dashboard.name}} <s-copy-id :id="dashboard.id"></s-copy-id></h3>
                            </div>
                        </div>

                        <div>
                            <pre>{{getDescription(dashboard)}}</pre>
                            <div v-if="dashboard.description.length > 100">
                                <button type="button" class="s-panel-desc-button" @click="expandDescription(dashboard.id)" th:text="#{dashboard.all.message.5}" v-if="!isDescriptionExpanded(dashboard.id)">
                                </button>
                                <button type="button" class="s-panel-desc-button" @click="collapseDescription(dashboard.id)" th:text="#{dashboard.all.message.6}" v-if="isDescriptionExpanded(dashboard.id)">
                                </button>
                            </div>
                        </div>
                        <div class="s-panel-actions">

                            <div class="pure-g">
                                <div class="pure-u-1">
                                    <button @click="openDashboardPage(dashboard)" class="pure-button" type="button" th:text="#{dashboard.all.message.9}" v-if="isOpenAvailable(dashboard)">Open</button>
                                    <button @click="goToCodePage(dashboard)" class="pure-button ml-1" type="button" th:text="#{dashboard.all.message.8}" v-if="superAccess">Code</button>
                                    <button @click="goToEditPage(dashboard)" class="pure-button ml-1" type="button" th:text="#{dashboard.all.message.7}" v-if="superAccess">Edit</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <h3 th:text="#{dashboard.all.message.10}" class="s-align-center" v-if="!filteredDashboards.length">Nothing to display</h3>

            <s-footer></s-footer>
        </div>
        <script type="module" src="./main.js"></script>
    </main>
</body>

</html>
