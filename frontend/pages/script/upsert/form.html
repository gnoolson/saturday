<form class="pure-form">
    <fieldset>
        <div class="pure-control-group">
            <s-id :id="script.id" :empty-id="emptyId"></s-id>
        </div>

        <div class="pure-control-group">
            <s-select-project :errors="errors" field="projectId" th:label="#{script.upsert.message.7}" v-model:value="script.projectId" @changed="scriptChangedCallback()" :projects="projects" :empty-id="emptyId" :entity-id="script.id" info="script#project" :classes="['pure-u-1']"></s-select-project>
        </div>

        <div class="pure-control-group">
            <s-input :errors="errors" field="name" th:label="#{script.upsert.message.8}" v-model:value="script.name" @changed="scriptChangedCallback()" info="script#name" :classes="['pure-u-1']"></s-input>
        </div>

        <div class="pure-control-group">
            <s-textarea :errors="errors" field="description" th:label="#{script.upsert.message.9}" v-model:value="script.description" @changed="scriptChangedCallback()" rows="4" info="script#description" :classes="['pure-u-1']"></s-textarea>
        </div>

        <div class="pure-control-group">
            <s-select-event-handler :errors="errors" field="errorEventHandler" th:label="#{script.upsert.message.10}" th:error-message="#{select_event_handler.message.0}" v-model:value="script.errorEventHandler" @changed="scriptChangedCallback()" :scripts="filteredScripts" :empty-id="emptyId"
                :ready="dataLoaded" :selected-project="script.projectId" info="script#error-handler" :classes="['pure-u-1']"></s-select-event-handler>
        </div>

        <div class="pure-control-group">
            <div class="pure-g">
                <div class="pure-u-1-2">
                    <label>
                        <span th:text="#{script.upsert.message.11}" class="mr-1">Caching Time</span>
                        <a href="/doc/script#cache" target="_blank"><img src="/static/img/info-circle-svgrepo-com.svg" class="s-svg-icon" /></a>
                    </label>
                </div>
                <div class="pure-u-1-2 s-align-right">
                    {{minutesToString(script.cachingTime)}}
                </div>
            </div>
            <input type="range" v-model="script.cachingTime" min="0" max="10800" step="60" class="pure-input-1" @change="scriptChangedCallback()" />
        </div>

        <s-cb th:label="#{script.upsert.message.12}" v-model:value="script.autostart" info="script#autostart" @changed="scriptChangedCallback()"></s-cb>
       
    </fieldset>
</form>
