<!DOCTYPE html>
<html lang="uk" xmlns:th="http://thymeleaf.org">

<head>
    <load src="../../_components/head/common.html" />
    <title th:text="#{script.log.message.2}"></title>

    <link rel="stylesheet" href="./style.scss">
    <script th:inline="javascript">
        const scriptId = /*[[${ id }]]*/ "";
        const superAccess = /*[[${ superAccess }]]*/ "";
        const message_1 = /*[[#{ script.log.message.1 }]]*/ "";
    </script>
</head>

<body>
    <main>
        <load src="../../_components/top.html" />
        <div class="s-main-container" id="app">

            <div class="pure-g">
                <div class="pure-u-md-2-3 pure-u-1">
                    <h2 class="">
                        <span th:utext="#{script.log.message.3}">Log</span>
                    </h2>
                </div>
                <div class="pure-u-md-1-3 pure-u-1 s-align-right pt-2">
                    <button @click="goToCodePage()" th:text="#{script.log.message.10}" v-if="codeButtonAvailable" class="pure-button">Code</button>
                    <button @click="goToEditPage()" th:text="#{script.log.message.7}" v-if="editButtonAvailable" class="pure-button ml-1">Edit</button>
                    <button @click="clear()" th:text="#{script.log.message.9}" class="pure-button pure-button-primary ml-1" :disabled="clearButtonDisabled">Clear</button>
                </div>
            </div>

            <p th:utext="#{script.log.message.11}"></p>
            <div class="">
                <span>"debug" Level: </span>
                <span class="s-clickable-mark secondary" v-if="!debugEnabled" @click="debugEnable(true)" th:text="#{script.log.message.6}">Disabled</span>
                <span class="s-clickable-mark" v-if="debugEnabled" @click="debugEnable(false)" th:text="#{script.log.message.5}">Enabled</span>
            </div>

            <hr class="s-hl" />

            <div class="pure-g">
                <div class="pure-u-1-2">
                    <span th:text="#{script.log.message.4}">Rows: </span>:
                    <span class="s-clickable-mark" :class="{'secondary': showRows !== 100}" @click="loadRows(100)">100</span>
                    <span class="s-clickable-mark" :class="{'secondary': showRows !== 1000}" @click="loadRows(1000)">1k</span>
                    <span class="s-clickable-mark" :class="{'secondary': showRows !== 10000}" @click="loadRows(10000)">10k</span>
                </div>
                <div class="pure-u-1-2 s-align-right">
                    <span @click="loadLog()" th:text="#{script.log.message.8}" class="s-clickable-mark">Refresh</span>
                </div>
            </div>

            <div>
                <pre id="log-pre">{{log}}</pre>
            </div>

            <s-footer></s-footer>
        </div>
        <script type="module" src="./main.js"></script>
    </main>
</body>

</html>
