<!DOCTYPE html>
<html lang="uk" xmlns:th="http://thymeleaf.org">

<head>
    <load src="../../_components/head/common.html" />
    <title th:text="#{script.errors.message.1}"></title>

    <link rel="stylesheet" href="./style.scss">
    <script th:inline="javascript">
        const scriptId = /*[[${ id }]]*/ "";
        const superAccess = /*[[${ superAccess }]]*/ "";
        const maxNumberOfErrors = /*[[${ maxNumberOfErrors }]]*/ "";
    </script>
</head>

<body>
    <main>
        <load src="../../_components/top.html" />
        <div class="s-main-container" id="app">

            <div class="pure-g">
                <div class="pure-u-1 pure-u-md-2-3">
                    <h2 th:utext="#{script.errors.message.2}">Errors</h2>
                    <p v-if="scriptBlocked">
                        <span th:text="#{script.errors.message.7}"></span>
                        <span class="ml-1">({{errors.length}}/{{maxNumberOfErrors}})</span>
                    </p>
                    <p v-if="!scriptBlocked">
                        <span th:text="#{script.errors.message.3}"></span>
                        <span class="ml-1">({{errors.length}}/{{maxNumberOfErrors}})</span>
                    </p>
                </div>
                <div class="pure-u-1 pure-u-md-1-3 s-align-right pt-2">
                    <button @click="goToCodePage()" th:text="#{script.errors.message.6}" v-if="superAccess" class="pure-button mr-1">Code</button>
                    <button @click="goToEditPage()" th:text="#{script.errors.message.4}" v-if="superAccess" class="pure-button mr-1">Edit</button>
                    <button th:text="#{script.errors.message.5}" :disabled="clearErrorsButtonDisabled" @click="clearErrors()" class="pure-button pure-button-primary">Clear Errors</button>
                </div>
            </div>

            <hr class="s-hl" />

            <div class="pure-g pt-2">
                <div class="pure-u-1 " v-for="error in errors">
                    <div class="s-panel-card">
                        <div class="s-panel-name">
                            <div>{{toDate(error.time)}}</div>
                        </div>
                        <div>
                            {{error.reason}}
                        </div>
                        <div class="s-panel-actions">
                            <button @click="showStack(error)" th:text="#{script.errors.message.8}" class="pure-button">
                                Show Stack
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <h3 th:text="#{script.errors.message.9}" class="s-align-center" v-if="!errors.length">
                Nothing to display
            </h3>

            <load src="./dialog.html" />

            <s-footer></s-footer>
        </div>
        <script type="module" src="./main.js"></script>
    </main>
</body>

</html>
