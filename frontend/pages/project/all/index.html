<!DOCTYPE html>
<html lang="uk" xmlns:th="http://thymeleaf.org">

<head>
    <load src="../../_components/head/common.html" />
    <title th:text="#{project.all.message.1}"></title>

    <link rel="stylesheet" href="./style.scss">
</head>

<body>
    <main id="app">
        <load src="../../_components/top.html" />

        <div class="s-main-container">
            <div class="pure-g">
                <div class="pure-u-1">
                    <h2 th:text="#{project.all.message.2}"></h2>
                    <p th:text="#{project.all.message.3}">
                    </p>
                </div>
            </div>

            <hr class="s-hl">

            <div class="pure-g">
                <div class="pure-u-1-2">
                    <s-name-filter :entities="projects" page="projects" :ready="projectsLoaded" th:placeholder="#{name_filter.message.0}" @result="setResultAfterNameFilter"></s-name-filter>
                </div>
                <div class="pure-u-1-2 s-align-right" v-if="superAccess">
                    <button type="button" class="pure-button pure-button-primary pt-2" @click="goToCreateNewPage()" th:text="#{project.all.message.4}">Create</button>
                </div>
            </div>

            <div class="pure-g pt-2">

                <div class="pure-u-1 " v-for="project in filteredProjects">
                    <div class="s-panel-card">
                        <h3 class="s-panel-name">{{project.name}}</h3>
                        <div>
                            <pre>{{getDescription(project)}}</pre>
                            <div v-if="project.description.length > 100">
                                <button type="button" class="s-panel-desc-button" @click="expandDescription(project.id)" th:text="#{project.all.message.5}" v-if="!isDescriptionExpanded(project.id)">
                                </button>
                                <button type="button" class="s-panel-desc-button" @click="collapseDescription(project.id)" th:text="#{project.all.message.6}" v-if="isDescriptionExpanded(project.id)">
                                </button>
                            </div>
                        </div>
                        <div class="s-panel-actions">
                            <button @click="goToEditPage(project)" class="pure-button" type="button" v-if="superAccess" th:text="#{project.all.message.7}">Edit</button>
                        </div>
                    </div>
                </div>

            </div>

            <h3 th:text="#{project.all.message.8}" class="s-align-center" v-if="!filteredProjects.length">
                Nothing to display
            </h3>

            <s-footer></s-footer>
        </div>
        <script type="module" src="./main.js"></script>
    </main>
</body>

</html>
