<!DOCTYPE html>
<html lang="uk" xmlns:th="http://thymeleaf.org">

<head>
    <load src="../_components/head/common.html" />
    <title th:text="#{create_super.message.1}"></title>
    <link rel="stylesheet" href="./style.scss">
        <script th:inline="javascript">
        const message_1 = /*[[#{ create_super.message.8 }]]*/ "";
    </script>
</head>

<body>
    <main>
        <load src="../_components/top.html" />
        <div class="s-main-container" id="app">

            <div class="pure-g">
                <div class="pure-u-1">

                    <h2 th:text="#{create_super.message.2}"></h2>
                    <p th:text="#{create_super.message.3}"></p>

                    <hr class="s-hl">

                    <form class="pure-form pure-form-aligned" id="create-super-form">
                        <fieldset>
                            <div class="pure-control-group">
                                <s-input :errors="errors" field="username" th:label="#{create_super.message.4}" v-model:value="user.username" type="text" :info="false" :classes="['pure-u-1', 'pure-u-sm-1-2', 'pure-u-md-1-4']" autocomplete="disabled"></s-input>
                            </div>

                            <div class="pure-control-group">
                                <s-input :errors="errors" field="password" th:label="#{create_super.message.5}" v-model:value="user.password" type="password" :info="false" :classes="['pure-u-1', 'pure-u-sm-1-2', 'pure-u-md-1-4']" autocomplete="disabled"></s-input>
                            </div>

                            <div class="pure-control-group">
                                <s-input :errors="errors" field="password" th:label="#{create_super.message.6}" v-model:value="user.confirmPassword" type="password" :info="false" :classes="['pure-u-1', 'pure-u-sm-1-2', 'pure-u-md-1-4']" autocomplete="disabled"></s-input>
                            </div>

                            <div class="pure-controls">
                                <button type="button" class="pure-button pure-button-primary" th:text=#{create_super.message.7} @click="createEditor()">Save</button>

                                <div class="pt-3">
                                    <s-error-message :errors="errors" field="service"></s-error-message>
                                </div>
                            </div>

                        </fieldset>
                    </form>

                    <hr class="s-hl">


                    <div class="l-footer">
                        <a href="?lang=en">EN</a> | <a href="?lang=uk">УКР</a>
                    </div>
                </div>
            </div>

        </div>
        <script type="module" src="./main.js"></script>
    </main>
</body>

</html>
