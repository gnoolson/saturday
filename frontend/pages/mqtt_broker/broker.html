<div class="s-panel-card my-4">
    <div class="pure-g">
        <div class="pure-u-1-2">
            <h3 class="s-panel-name" th:text="#{mqtt_broker.message.23}">
                Internal MQTT Broker
            </h3>
        </div>
        <div class="pure-u-1-2 s-align-right">
            <span class="s-badge s-badge-green" v-if="broker.started" th:text="#{mqtt_broker.message.8}">Started</span>
            <span class="s-badge s-badge-red" v-if="!broker.started" th:text="#{mqtt_broker.message.9}">Stopped</span>
        </div>
    </div>
    <div>
        <form class="pure-form" v-if="!broker.useBrokerConfigurationOnly">
            <fieldset>
                <div class="pure-control-group">
                    <s-cb th:label="#{mqtt_broker.message.7}" v-model:value="broker.allowAnonymousConnections" @changed="scriptChangedCallback()" :disabled="broker.started"></s-cb>
                </div>
                <div class="pure-control-group pt-2">
                    <s-input :errors="errors" field="port" th:label="#{mqtt_broker.message.6}" v-model:value="broker.port"  type="number" :disabled="broker.started" :classes="['pure-u-1-3']"></s-input>
                </div>
            </fieldset>
        </form>
    </div>
    <div class="s-panel-actions">
        <button class="pure-button" role="button" @click="start()" v-if="!broker.started" :disabled="controlButtonDisabled" th:text="#{mqtt_broker.message.10}">Start</button>
        <button class="pure-button" role="button" @click="stop()" v-if="broker.started" :disabled="controlButtonDisabled" th:text="#{mqtt_broker.message.11}">Stop</button>
    </div>
</div>
