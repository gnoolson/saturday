<!DOCTYPE html>
<html lang="uk" xmlns:th="http://thymeleaf.org">

<head>
    <load src="../../_components/head/common.html" />
    <title th:text="#{schedule.all.message.1}"></title>

    <link rel="stylesheet" href="./style.scss">
</head>

<body>
    <main>
        <load src="../../_components/top.html" />
        <div class="s-main-container" id="app">

            <div class="pure-g">
                <div class="pure-u-1">
                    <h2 th:text="#{schedule.all.message.2}"></h2>
                    <p th:text="#{schedule.all.message.3}">
                    </p>
                </div>
            </div>

            <hr class="s-hl">

            <div class="pure-g">
                <div class="pure-u-1-2">
                    <s-project-filter :projects="projects" :entities="schedules" page="schedules" :ready="projectsAndSchedulesLoaded" th:default-value-label="#{project_filter.message.0}" @result="setResultAfterProjectFilter"></s-project-filter>
                    <s-name-filter :entities="resultAfterProjectFilter" page="schedules" :ready="projectsAndSchedulesLoaded" th:placeholder="#{name_filter.message.0}" @result="setResultAfterNameFilter"></s-name-filter>
                </div>
                <div class="pure-u-1-2 s-align-right">
                    <button type="button" class="pure-button pure-button-primary pt-2" @click="goToCreateNewPage()" v-if="superAccess" th:text="#{schedule.all.message.4}">Create</button>
                </div>
            </div>

            <div class="pure-g pt-2">
                <div class="pure-u-1" v-for="schedule in filteredSchedules">
                    <div class="s-panel-card">
                        <span class="s-badge">{{getProjectNameById(schedule.projectId)}}</span>

                        <div class="pure-g">
                            <div class="pure-u-1 pure-u-sm-1-2">
                                <h3 class="s-panel-name">{{schedule.name}}</h3>
                            </div>
                            <div class="pure-u-1 pure-u-sm-1-2 s-align-right">
                                <span class="s-badge s-badge-green" v-if="schedule.enabled" th:text="#{schedule.all.message.6}">
                                    status: enabled
                                </span>
                                <span class="s-badge s-badge-red" v-if="!schedule.enabled" th:text="#{schedule.all.message.7}">
                                    status: disabled
                                </span>
                            </div>
                        </div>

                        <span>
                            <span class="s-code">
                                {{schedule.cronExpression}}
                            </span>
                        </span>

                        <div>
                            <pre>{{getDescription(schedule)}}</pre>
                            <div v-if="schedule.description.length > 100">
                                <button type="button" class="s-panel-desc-button" @click="expandDescription(schedule.id)" th:text="#{schedule.all.message.9}" v-if="!isDescriptionExpanded(schedule.id)">
                                </button>
                                <button type="button" class="s-panel-desc-button" @click="collapseDescription(schedule.id)" th:text="#{schedule.all.message.10}" v-if="isDescriptionExpanded(schedule.id)">
                                </button>
                            </div>
                        </div>
                        <div class="s-panel-actions">

                            <div class="pure-g" v-if="superAccess">
                                <div class="pure-u-1-4 s-align-left">
                                    <button th:text="#{schedule.all.message.11}" class="pure-button ml-1 mt-1" v-if="isEnableButtonAvailable(schedule)" @click="control(schedule.id, true)">
                                        Enable
                                    </button>

                                    <button th:text="#{schedule.all.message.12}" class="pure-button ml-1 mt-1" v-if="isDisableButtonAvailable(schedule)" @click="control(schedule.id, false)">
                                        Disable
                                    </button>
                                </div>
                                <div class="pure-u-3-4">
                                    <button @click="goToEditPage(schedule)" class="pure-button ml-1 mt-1" type="button" th:text="#{schedule.all.message.14}">Edit</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <h3 th:text="#{schedule.all.message.13}" class="s-align-center" v-if="!filteredSchedules.length">Nothing to display</h3>

            <s-footer></s-footer>
        </div>
        <script type="module" src="./main.js"></script>
    </main>
</body>

</html>
