<!DOCTYPE html>
<html lang="uk" xmlns:th="http://thymeleaf.org">

<head>
    <load src="../../_components/head/common.html" />
    <title th:text="#{plugin.all.message.1}"></title>
    <link rel="stylesheet" href="./style.scss">
    <script th:inline="javascript">
    </script>
</head>

<body>
    <main>
        <load src="../../_components/top.html" />
        <div class="s-main-container" id="app">

            <div class="pure-g">
                <div class="pure-u-1">
                    <h2 th:text="#{plugin.all.message.2}"></h2>
                    <p th:text="#{plugin.all.message.4}"></p>
                </div>
            </div>

            <table v-if="plugins.length" class="pure-table s-w100 pure-table-horizontal mt-5">
                <tbody>
                    <tr v-for="plugin in plugins">
                        <td class="s-w100">
                            <a :href="'/plugin/' + plugin.id">{{plugin.id}}</a>
                        </td>
                        <td>{{plugin.version}}</td>
                        <td>
                            <span class="s-badge s-badge-green" v-if="plugin.status == 'STARTED'">{{plugin.status}}</span>
                            <span class="s-badge s-badge-red" v-if="plugin.status != 'STARTED'">{{plugin.status}}</span>
                        </td>
                        <td>
                            <button th:text="#{plugin.all.message.7}" @click="control(plugin.id, true)" v-if="enableButtonAvailable(plugin)" style="width: 120px" class="pure-button">Enable</button>
                            <button th:text="#{plugin.all.message.8}" @click="control(plugin.id, false)" v-if="disableButtonAvailable(plugin)" style="width: 120px" class="pure-button">Disable</button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div v-if="plugins.length == 0">
                <hr class="s-hl" />
                <div class="s-align-center" th:text="#{plugin.all.message.3}">
                    Empty
                </div>
            </div>

            <s-footer></s-footer>
        </div>
        <script type="module" src="./main.js"></script>
    </main>
</body>

</html>
